name: Scrape Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15,21 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Chrome
        run: npx puppeteer browsers install chrome

      - name: Run analysis scraper
        run: node scrape_analysis.js

      - name: Commit analysis.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis.json
          git commit -m "Update analysis.json" || echo "no changes"
          git pull --rebase origin main
          git push
